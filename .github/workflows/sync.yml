name: Garmin Sync

on:
  schedule:
    - cron: '0 * * * *'   # on the hour: full sync (wellness + activities) + GPS/PB at set hours
    - cron: '30 * * * *'  # half past: activities only (no wellness refresh)
    # Morning sync: full (wellness + activities) + GPS/PB. Two entries because GitHub cron is UTC:
    # 06:15 UTC = 07:15 London in summer (BST), 07:15 UTC = 07:15 London in winter (GMT).
    # The gate step below lets only the one matching London 07:xx through.
    # Set at :15 (not :30) because GitHub delays scheduled runs, so it should land around 07:30.
    - cron: '15 6 * * *'
    - cron: '15 7 * * *'
  workflow_dispatch:        # allows manual trigger from GitHub UI

# Never let two runs overlap (avoids simultaneous Garmin logins and push conflicts)
concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to commit data.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Gate morning schedule on London time
        id: gate
        run: |
          S="${{ github.event.schedule }}"
          if [ "$S" = "15 6 * * *" ] || [ "$S" = "15 7 * * *" ]; then
            if [ "$(TZ=Europe/London date +%H)" != "07" ]; then
              echo "London hour is $(TZ=Europe/London date +%H), not 07: skipping this duplicate morning trigger"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install garminconnect python-dotenv

      - name: Fetch Garmin data
        if: steps.gate.outputs.skip != 'true'
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DAYS_TO_SYNC:    365
          SYNC_MODE:       ${{ github.event.schedule == '30 * * * *' && 'activities' || 'full' }}
        run: python fetch_garmin.py

      # Per-second GPS goes to gps/, separate from data.json so regular analysis stays small.
      # Runs on the hourly schedule at 06/12/18/22 UTC and on manual trigger (limits extra Garmin logins).
      # continue-on-error: a GPS/rate-limit failure never blocks the data.json sync.
      - name: Fetch per-second GPS and personal bests
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GPS_DAYS:        90
        run: |
          H=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "15 6 * * *" ] || [ "${{ github.event.schedule }}" = "15 7 * * *" ] || { [ "${{ github.event.schedule }}" = "0 * * * *" ] && echo "06 12 18 22" | grep -qw "$H"; }; then
            gps=0; pbs=0
            python fetch_gps.py || gps=1
            python fetch_pbs.py || pbs=1
            exit $(( gps || pbs ))
          else
            echo "Skipping GPS/PB fetch at hour $H UTC"
          fi

      - name: Commit and push data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -d gps ]; then git add gps/; fi
          for f in pbs.json pb_history.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --staged --quiet || git commit -m "chore: update garmin data $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
