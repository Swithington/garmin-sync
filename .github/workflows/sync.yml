name: Garmin Sync

on:
  schedule:
    - cron: '0 * * * *'   # runs hourly
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to commit data.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install garminconnect python-dotenv

      - name: Fetch Garmin data
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DAYS_TO_SYNC:    365
        run: python fetch_garmin.py

      # Per-second GPS goes to gps/, separate from data.json so regular analysis stays small.
      # Runs at 06/12/18/22 UTC and on manual trigger (limits extra Garmin logins).
      # continue-on-error: a GPS/rate-limit failure never blocks the data.json sync.
      - name: Fetch per-second GPS
        continue-on-error: true
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GPS_DAYS:        90
        run: |
          H=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "06 12 18 22" | grep -qw "$H"; then
            python fetch_gps.py
          else
            echo "Skipping GPS fetch at hour $H UTC"
          fi

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -d gps ]; then git add gps/; fi
          git diff --staged --quiet || git commit -m "chore: update garmin data $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
